---
name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  actions: none
  checks: none
  contents: read
  deployments: none
  id-token: none
  issues: none
  discussions: none
  packages: none
  pages: none
  pull-requests: none
  repository-projects: none
  security-events: none
  statuses: none

jobs:
  pre-commit:
    timeout-minutes: 2
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.x'

      - name: Install pre-commit
        run: |
          pip3 install pre-commit

      - name: Run pre-commit (ci alias)
        run: |
          test -f .pre-commit-config.yaml

          pre-commit run ci --all-files

  shellcheck:
    timeout-minutes: 1
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Run ShellCheck
        run: |
          # Find shell scripts safely
          files=$(git ls-files '*.sh' '*.bash' 2>/dev/null || true)

          test -f .shellcheckrc

          if [ -z "$files" ]; then
            echo "No shell scripts found"
            exit 0
          fi

          echo "Running ShellCheck"

          shellcheck --rcfile=.shellcheckrc -x "$files"

  yamllint:
    timeout-minutes: 1
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.x'

      - name: Install yamllint
        run: |
          pip3 install yamllint

      - name: Run yamllint
        run: |
          set -euo pipefail

          test -f .yamllint.yml

          echo "Running yamllint"

          yamllint -c .yamllint.yml .

  markdownlint:
    timeout-minutes: 1
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 24.x

      - name: Install markdownlint-cli
        run: |
          npm install --global markdownlint-cli2

      - name: Run markdownlint
        run: |
          set -euo pipefail

          test -f .markdownlint-cli2.jsonc

          echo "Running markdownlint"

          markdownlint-cli2 --config .markdownlint-cli2.jsonc .

  actionlint:
    timeout-minutes: 1
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install actionlint
        run: |
          set -euo pipefail

          bash <(curl https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)

          sudo mv actionlint /usr/local/bin/actionlint

          actionlint -version

      - name: Run actionlint
        run: |
          set -euo pipefail

          echo "Running actionlint"

          actionlint

  build-test:
    name: Build Image
    runs-on: ubuntu-24.04-arm
    strategy:
      matrix:
        include:
          - platform: amd64
            variant: core
            grav_admin: 'false'
          - platform: arm64
            variant: core
            grav_admin: 'false'
          - platform: amd64
            variant: admin
            grav_admin: 'true'
          - platform: arm64
            variant: admin
            grav_admin: 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Get Date
        run: |
          DATE=$(date +"%Y%m%d")
          echo "${DATE}"
          echo "DATE=${DATE}" >> $GITHUB_ENV

      - name: Get GRAV Version
        run: |
          GRAV_VERSION=$(curl -sL "https://api.github.com/repos/getgrav/grav/releases/latest" | grep tag_name | cut -d '"' -f 4)
          echo "${GRAV_VERSION}"
          echo "GRAV_VERSION=${GRAV_VERSION}" >> $GITHUB_ENV

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Docker - Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          file: ./Dockerfile
          platforms: linux/${{ matrix.platform }}
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            dsavell/grav:${{ matrix.variant }}
            dsavell/grav:${{ matrix.variant }}-${{ env.GRAV_VERSION }}
            dsavell/grav:${{ matrix.variant }}-${{ env.DATE }}
            dsavell/grav:${{ matrix.variant }}-${{ env.GRAV_VERSION }}-${{ env.DATE }}
          build-args: |
            GRAV_VERSION=${{ env.GRAV_VERSION }}
            GRAV_ADMIN=${{ matrix.grav_admin }}

  trigger-release:
    name: Trigger Release
    needs: build-test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-26.04-arm
    permissions:
      actions: write
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Trigger Release
        run: |
          gh workflow run release.yml \
            --repo ${{ github.repository }} \
            --ref ${{ github.ref_name }}

---
name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  actions: none
  checks: none
  contents: read
  deployments: none
  id-token: none
  issues: none
  discussions: none
  packages: none
  pages: none
  pull-requests: none
  repository-projects: none
  security-events: none
  statuses: none

jobs:
  build-test:
    name: Build Image
    runs-on: ubuntu-26.04-arm
    strategy:
      matrix:
        include:
          - platform: amd64
            variant: core
            grav_admin: 'false'
          - platform: arm64
            variant: core
            grav_admin: 'false'
          - platform: amd64
            variant: admin
            grav_admin: 'true'
          - platform: arm64
            variant: admin
            grav_admin: 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Get Date
        run: |
          DATE=$(date +"%Y%m%d")
          echo "${DATE}"
          echo "DATE=${DATE}" >> $GITHUB_ENV

      - name: Get GRAV Version
        run: |
          GRAV_VERSION=$(curl -sL "https://api.github.com/repos/getgrav/grav/releases/latest" | grep tag_name | cut -d '"' -f 4)
          echo "${GRAV_VERSION}"
          echo "GRAV_VERSION=${GRAV_VERSION}" >> $GITHUB_ENV

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Docker - Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          file: ./Dockerfile
          platforms: linux/${{ matrix.platform }}
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            dsavell/grav:${{ matrix.variant }}
            dsavell/grav:${{ matrix.variant }}-${{ env.GRAV_VERSION }}
            dsavell/grav:${{ matrix.variant }}-${{ env.DATE }}
            dsavell/grav:${{ matrix.variant }}-${{ env.GRAV_VERSION }}-${{ env.DATE }}
          build-args: |
            GRAV_VERSION=${{ env.GRAV_VERSION }}
            GRAV_ADMIN=${{ matrix.grav_admin }}

      - name: Docker - Run
        env:
          IMAGE: dsavell/grav:${{ matrix.variant }}-${{ env.GRAV_VERSION }}-${{ env.DATE }}
        run: |
          docker run --detach \
            --platform "linux/${{ matrix.platform }}" \
            --name grav_test \
            --publish 127.0.0.1:8080:80 \
            "$IMAGE"

      - name: Test - Grav responds over HTTP
        run: |
          if ! curl --fail --silent --show-error --location \
            --retry 20 --retry-connrefused --retry-delay 2 --retry-all-errors \
            http://127.0.0.1:8080/ --output /tmp/grav-response.html; then
            docker logs grav_test
            exit 1
          fi
          if ! grep -qi "Grav" /tmp/grav-response.html; then
            echo "Response did not contain expected Grav content"
            docker logs grav_test
            exit 1
          fi

      - name: Test - Admin is available
        if: matrix.variant == 'admin'
        run: |
          if ! curl --fail --silent --show-error --location \
            --retry 20 --retry-connrefused --retry-delay 2 --retry-all-errors \
            http://127.0.0.1:8080/admin/ --output /tmp/grav-admin-response.html; then
            docker logs grav_test
            exit 1
          fi
          if ! grep -qi "Grav" /tmp/grav-admin-response.html; then
            echo "Admin response did not contain expected Grav content"
            docker logs grav_test
            exit 1
          fi

      - name: Docker - Cleanup
        if: always()
        run: docker rm --force grav_test || true
---
name: Release

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  release:
    name: Release ${{ matrix.variant }} image
    runs-on: ubuntu-26.04-arm
    strategy:
      matrix:
        include:
          - variant: core
            grav_admin: 'false'
          - variant: admin
            grav_admin: 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Get Date
        run: |
          DATE=$(date +"%Y%m%d")
          echo "${DATE}"
          echo "DATE=${DATE}" >> "$GITHUB_ENV"

      - name: Get GRAV Version
        run: |
          GRAV_VERSION=$(curl -sL "https://api.github.com/repos/getgrav/grav/releases/latest" | grep tag_name | cut -d '"' -f 4)
          echo "${GRAV_VERSION}"
          echo "GRAV_VERSION=${GRAV_VERSION}" >> "$GITHUB_ENV"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1  # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      - name: Login to DockerHub
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6  # v4.7.0
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6  # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          cache-from: type=gha,scope=grav-${{ matrix.variant }}-release
          cache-to: type=gha,scope=grav-${{ matrix.variant }}-release,mode=max
          tags: |
            dsavell/grav:${{ matrix.variant }}
            dsavell/grav:${{ matrix.variant }}-${{ env.GRAV_VERSION }}
            dsavell/grav:${{ matrix.variant }}-${{ env.DATE }}
            dsavell/grav:${{ matrix.variant }}-${{ env.GRAV_VERSION }}-${{ env.DATE }}
            ghcr.io/${{ github.repository }}:${{ matrix.variant }}
            ghcr.io/${{ github.repository }}:${{ matrix.variant }}-${{ env.GRAV_VERSION }}
            ghcr.io/${{ github.repository }}:${{ matrix.variant }}-${{ env.DATE }}
            ghcr.io/${{ github.repository }}:${{ matrix.variant }}-${{ env.GRAV_VERSION }}-${{ env.DATE }}
          build-args: |
            GRAV_VERSION=${{ env.GRAV_VERSION }}
            GRAV_ADMIN=${{ matrix.grav_admin }}

---
ignore:
  - vulnerability: GHSA-5mv2-rx3q-4w2v
    package:
      name: twig/twig
    reason: >-
      Grav's getgrav/Twig fork includes the upstream sandbox sort-filter fix:
      https://github.com/twigphp/Twig/security/advisories/GHSA-5mv2-rx3q-4w2v
      Checked at Grav's pinned Twig commit; this ignore rule does not verify
      that commit automatically:
      https://github.com/getgrav/Twig/blob/d1f6cc220f095f1b30d017ef91ed1e88cd65836e/src/Extension/CoreExtension.php
  - vulnerability: GHSA-52m2-vc4m-jj33
    package:
      name: twig/twig
    reason: >-
      Grav's getgrav/Twig fork includes the upstream filesystem-loader path
      validation fix:
      https://github.com/twigphp/Twig/security/advisories/GHSA-52m2-vc4m-jj33
      Checked at Grav's pinned Twig commit; this ignore rule does not verify
      that commit automatically:
      https://github.com/getgrav/Twig/blob/d1f6cc220f095f1b30d017ef91ed1e88cd65836e/src/Loader/FilesystemLoader.php
  - vulnerability: GHSA-7p85-w9px-jpjp
    package:
      name: twig/twig
    reason: >-
      Grav's getgrav/Twig fork includes the upstream compiler single-quote
      escaping fix:
      https://github.com/twigphp/Twig/security/advisories/GHSA-7p85-w9px-jpjp
      Checked at Grav's pinned Twig commit; this ignore rule does not verify
      that commit automatically:
      https://github.com/getgrav/Twig/blob/d1f6cc220f095f1b30d017ef91ed1e88cd65836e/src/Compiler.php
  - vulnerability: GHSA-pr2w-4gpj-cpq4
    package:
      name: twig/twig
    reason: >-
      The fork's sandbox visitor guards coercing nodes and spread arguments:
      https://github.com/twigphp/Twig/security/advisories/GHSA-pr2w-4gpj-cpq4
      Checked at Grav's pinned Twig commit; this ignore rule does not verify
      that commit automatically:
      https://github.com/getgrav/Twig/blob/d1f6cc220f095f1b30d017ef91ed1e88cd65836e/src/NodeVisitor/SandboxNodeVisitor.php
      https://github.com/getgrav/Twig/blob/d1f6cc220f095f1b30d017ef91ed1e88cd65836e/src/Node/CoercesChildrenToStringInterface.php
  - vulnerability: GHSA-529h-vh3j-85hq
    package:
      name: twig/twig
    reason: >-
      The fork hands previously trusted cached templates to sandbox-checked
      variants, or fails closed:
      https://github.com/twigphp/Twig/security/advisories/GHSA-529h-vh3j-85hq
      Checked at Grav's pinned Twig commit; this ignore rule does not verify
      that commit automatically:
      https://github.com/getgrav/Twig/blob/d1f6cc220f095f1b30d017ef91ed1e88cd65836e/src/Node/TrustedTemplateGuardNode.php
      https://github.com/getgrav/Twig/blob/d1f6cc220f095f1b30d017ef91ed1e88cd65836e/src/Template.php

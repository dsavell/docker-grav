server {
    listen 80 default_server;
    server_name _;

    root /var/www/html; # Change this to the directory containing Grav's index.php
    index index.php index.html;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Run only Grav's front controller through PHP-FPM.
    location = /index.php {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
    }

    # Don't execute other PHP files directly.
    location ~ \.php$ {
        return 404;
    }

    # Block hidden files, except ACME challenge files.
    location ~ /\.(?!well-known) {
        deny all;
    }
}
